version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: simaky-pterodactyl_web_1
      APP_PORT: 80
      # Pterodactyl has its own login.
      PROXY_AUTH_ADD: "false"

  db:
    image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: pterodactyl
      MARIADB_PASSWORD: ${APP_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: "1000:1000"
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/pterodactyl/panel:v1.15.2@sha256:cd7cda1727f110cee375ed52a95adfe73065548576715e7b92f8c899558271e3
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The panel talks to Wings through the node FQDN, which is mDNS-only.
    extra_hosts:
      - "${DEVICE_DOMAIN_NAME}:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/panel/var:/app/var
      - ${APP_DATA_DIR}/data/panel/logs:/app/storage/logs
    environment:
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8745
      APP_TIMEZONE: UTC
      APP_SERVICE_AUTHOR: noreply@umbrel.local
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      TRUSTED_PROXIES: "*"
      HASHIDS_LENGTH: "8"
      DB_HOST: simaky-pterodactyl_db_1
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${APP_PASSWORD}
      REDIS_HOST: simaky-pterodactyl_redis_1
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      MAIL_DRIVER: log
      MAIL_FROM: noreply@umbrel.local
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/ || exit 1"]
      start_period: 5m
      interval: 10s
      timeout: 5s
      retries: 5

  setup:
    image: ghcr.io/pterodactyl/panel:v1.15.2@sha256:cd7cda1727f110cee375ed52a95adfe73065548576715e7b92f8c899558271e3
    restart: "no"
    entrypoint: ["/bin/ash", "/umbrel-setup.sh"]
    depends_on:
      web:
        condition: service_healthy
    extra_hosts:
      - "${DEVICE_DOMAIN_NAME}:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/setup.sh:/umbrel-setup.sh:ro
      - ${APP_DATA_DIR}/data/panel/var:/app/var
      - ${APP_DATA_DIR}/data/wings:${APP_DATA_DIR}/data/wings
    environment:
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8745
      APP_TIMEZONE: UTC
      APP_ENV: production
      APP_ENVIRONMENT_ONLY: "false"
      DB_HOST: simaky-pterodactyl_db_1
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${APP_PASSWORD}
      REDIS_HOST: simaky-pterodactyl_redis_1
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      MAIL_DRIVER: log
      ADMIN_EMAIL: umbrel@umbrel.local
      ADMIN_USERNAME: umbrel
      ADMIN_PASSWORD: ${APP_PASSWORD}
      PANEL_REMOTE: http://simaky-pterodactyl_web_1
      NODE_FQDN: ${DEVICE_DOMAIN_NAME}
      WINGS_DIR: ${APP_DATA_DIR}/data/wings
      WINGS_PORT: "8746"
      SFTP_PORT: "2022"
      ALLOCATION_START: "25565"
      ALLOCATION_END: "25600"
      WINGS_NETWORK_NAME: simaky_pterodactyl_nw
      WINGS_NETWORK_SUBNET: 10.124.0.0/16
      WINGS_NETWORK_GATEWAY: 10.124.0.1
      WINGS_NETWORK_SUBNET_V6: fdba:17c8:6c94::/64
      WINGS_NETWORK_GATEWAY_V6: fdba:17c8:6c94::1011

  wings:
    image: ghcr.io/pterodactyl/wings:v1.13.4@sha256:f3eb1fcca035ba94256d612e31315bf33db948693db1a9c4646ce398aefc2f1b
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      setup:
        condition: service_completed_successfully
    command: ["--config", "${APP_DATA_DIR}/data/wings/config.yml"]
    tty: true
    ports:
      - "8746:8746"
      - "2022:2022"
    environment:
      TZ: UTC
      WINGS_UID: "988"
      WINGS_GID: "988"
      WINGS_USERNAME: pterodactyl
    volumes:
      # Game servers run as containers on the Umbrel's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      # Wings bind-mounts these paths into game containers, so they must be
      # identical inside this container and on the host.
      - ${APP_DATA_DIR}/data/wings:${APP_DATA_DIR}/data/wings
