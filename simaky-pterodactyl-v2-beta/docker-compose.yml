version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: simaky-pterodactyl-v2-beta_web_1
      APP_PORT: 80
      # Pterodactyl has its own login.
      PROXY_AUTH_ADD: "false"

  db:
    image: mariadb:11.4@sha256:1292844148b311e4ed4300022a996d39083f415a963e970cf47cad1b3b18e3a6
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: pterodactyl
      MARIADB_PASSWORD: ${APP_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: "1000:1000"
    restart: on-failure
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Panel 2.0 never migrates on startup; run it as an explicit step on every
  # app start so updates apply their schema changes before the panel boots.
  migrate:
    image: ghcr.io/pterodactyl/panel:v2.0.0-beta.2@sha256:b3f1229ab8143615a93d8207096059e9903b5b7868cfb34ae0152d22203618c0
    restart: "no"
    command: ["php", "artisan", "migrate", "--seed", "--force", "--isolated=1", "--no-interaction"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/data/panel/var:/app/var
      - ${APP_DATA_DIR}/data/panel/logs:/app/storage/logs
      - ${APP_DATA_DIR}/data/panel/extensions:/app/extensions
      - ${APP_DATA_DIR}/data/panel/extension-assets:/app/public/assets/extensions
    environment:
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8755
      APP_TIMEZONE: UTC
      APP_ENVIRONMENT_ONLY: "false"
      DB_HOST: simaky-pterodactyl-v2-beta_db_1
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${APP_PASSWORD}
      REDIS_HOST: simaky-pterodactyl-v2-beta_redis_1
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: sessions
      QUEUE_CONNECTION: redis
      MAIL_MAILER: log

  web:
    image: ghcr.io/pterodactyl/panel:v2.0.0-beta.2@sha256:b3f1229ab8143615a93d8207096059e9903b5b7868cfb34ae0152d22203618c0
    restart: on-failure
    # Longer than the queue worker timeout so running jobs can finish.
    stop_grace_period: 90s
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The panel talks to Wings through the node FQDN, which is mDNS-only.
    extra_hosts:
      - "${DEVICE_DOMAIN_NAME}:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/panel/var:/app/var
      - ${APP_DATA_DIR}/data/panel/logs:/app/storage/logs
      - ${APP_DATA_DIR}/data/panel/extensions:/app/extensions
      - ${APP_DATA_DIR}/data/panel/extension-assets:/app/public/assets/extensions
    environment:
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8755
      APP_TIMEZONE: UTC
      APP_SERVICE_AUTHOR: noreply@umbrel.local
      APP_ENVIRONMENT_ONLY: "false"
      TRUSTED_PROXIES: "*"
      DB_HOST: simaky-pterodactyl-v2-beta_db_1
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${APP_PASSWORD}
      REDIS_HOST: simaky-pterodactyl-v2-beta_redis_1
      REDIS_QUEUE_RETRY_AFTER: "90"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: sessions
      QUEUE_CONNECTION: redis
      QUEUE_WORKER_ENABLED: "true"
      SCHEDULER_ENABLED: "true"
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: noreply@umbrel.local
    # The image ships its own HEALTHCHECK; setup waits on it.

  setup:
    image: ghcr.io/pterodactyl/panel:v2.0.0-beta.2@sha256:b3f1229ab8143615a93d8207096059e9903b5b7868cfb34ae0152d22203618c0
    restart: "no"
    entrypoint: ["/bin/ash", "/umbrel-setup.sh"]
    depends_on:
      web:
        condition: service_healthy
    extra_hosts:
      - "${DEVICE_DOMAIN_NAME}:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/setup.sh:/umbrel-setup.sh:ro
      - ${APP_DATA_DIR}/data/panel/var:/app/var
      - ${APP_DATA_DIR}/data/panel/extensions:/app/extensions
      - ${APP_DATA_DIR}/data/wings:${APP_DATA_DIR}/data/wings
    environment:
      APP_URL: http://${DEVICE_DOMAIN_NAME}:8755
      APP_TIMEZONE: UTC
      APP_ENVIRONMENT_ONLY: "false"
      DB_HOST: simaky-pterodactyl-v2-beta_db_1
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: ${APP_PASSWORD}
      REDIS_HOST: simaky-pterodactyl-v2-beta_redis_1
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      SESSION_CONNECTION: sessions
      QUEUE_CONNECTION: redis
      MAIL_MAILER: log
      ADMIN_EMAIL: umbrel@umbrel.local
      ADMIN_USERNAME: umbrel
      ADMIN_PASSWORD: ${APP_PASSWORD}
      PANEL_REMOTE: http://simaky-pterodactyl-v2-beta_web_1
      NODE_FQDN: ${DEVICE_DOMAIN_NAME}
      WINGS_DIR: ${APP_DATA_DIR}/data/wings
      WINGS_PORT: "8756"
      SFTP_PORT: "2023"
      ALLOCATION_START: "26565"
      ALLOCATION_END: "26600"
      WINGS_NETWORK_NAME: simaky_pterodactyl_v2_nw
      WINGS_NETWORK_SUBNET: 10.125.0.0/16
      WINGS_NETWORK_GATEWAY: 10.125.0.1
      WINGS_NETWORK_SUBNET_V6: fdba:17c8:6c95::/64
      WINGS_NETWORK_GATEWAY_V6: fdba:17c8:6c95::1011

  wings:
    image: ghcr.io/pterodactyl/wings:v1.13.4@sha256:f3eb1fcca035ba94256d612e31315bf33db948693db1a9c4646ce398aefc2f1b
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      setup:
        condition: service_completed_successfully
    command: ["--config", "${APP_DATA_DIR}/data/wings/config.yml"]
    tty: true
    ports:
      - "8756:8756"
      - "2023:2023"
    environment:
      TZ: UTC
      WINGS_UID: "988"
      WINGS_GID: "988"
      WINGS_USERNAME: pterodactyl
    volumes:
      # Game servers run as containers on the Umbrel's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      # Wings bind-mounts these paths into game containers, so they must be
      # identical inside this container and on the host.
      - ${APP_DATA_DIR}/data/wings:${APP_DATA_DIR}/data/wings
