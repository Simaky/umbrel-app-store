description: >-
  ⚠️ Pterodactyl 2.0 is in open beta. Expect bugs, and keep important game servers on the stable
  Pterodactyl app.


  Pterodactyl 2.0 is a rebuilt version of the open-source game server management panel. It adds
  extensions that survive updates, themes with dark and light modes, a unified admin area, a one-click egg
  catalog, tags for eggs and nodes, and a console that works on phones.


  This app bundles everything Pterodactyl needs: the Panel, MariaDB, Redis and the Wings daemon. On first
  start it creates your admin account, a node called "Umbrel" connected to the bundled Wings, and port
  allocations 26565-26600, so you can create a server right away. It can be installed next to the stable
  Pterodactyl app.


  Ports used on your Umbrel:

  - 8755: Panel web interface

  - 8756: Wings API and console websocket

  - 2023: SFTP

  - 26565-26600: game server allocations (add more in the node's Allocation settings)


  ⚠️ Game servers run as containers on your Umbrel's Docker. Watch out for port conflicts with other apps.
  The node uses the address umbrel.local. If you open the panel by IP or through Tailscale, change the node's
  FQDN in the node settings so the server console can connect.


  ⚠️ Stop or delete your game servers in the panel before uninstalling this app.
releaseNotes: |-
  Pterodactyl Panel v2.0.0-beta.3 with Wings v1.13.5.

  Panel v2.0.0-beta.3:
  ### Fixed
  * The Docker image builds on PHP 8.4.27 and runs PHP-FPM with `session.upload_progress.enabled=0` (CVE-2026-109618, CVE-2026-109619).
  * The Docker image builds on Alpine 3.24, which ships nginx 1.30.7 (CVE-2026-123007, CVE-2026-123633).
  * An expired session, such as after a password change, sends you to the login page and back to where you were.
  * Files with an empty MIME type and a size of 0 or 4096 bytes upload instead of being rejected as folders.
  * The console resizes, selects words and opens links reliably.
  * The file editor highlights nested YAML, selections and search matches correctly.
  * Modals on narrow screens keep the page layout intact.
  * Files over the node's upload limit are refused before the upload starts.
  * The file editor's find and replace fields update on paste and every other edit, not only on key presses.

  ### Added
  * Adds custom user avatars, managed from the account page and by admins.
  * Adds a copy button for the startup command.
  * Adds the `ReplacesUserAvatars` action contract. `user-avatars` is a reserved extension id.
  * Adds a panel logo, uploaded from the general settings, shown as the favicon, on the login page and in place of the company name. A theme's own logo takes its place.
  * Adds the `ReplacesBrandLogo` action contract. `panel-logo` is a reserved extension id.
  * Adds a button to generate a secure password, and `generateSecurePassword`, `PasswordInput` and `FieldModel.setValue` to the SDK.

  ### Changed
