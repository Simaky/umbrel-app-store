description: >-
  ⚠️ Pterodactyl 2.0 is in open beta. Expect bugs, and keep important game servers on the stable
  Pterodactyl app.


  Pterodactyl 2.0 is a rebuilt version of the open-source game server management panel. It adds
  extensions that survive updates, themes with dark and light modes, a unified admin area, a one-click egg
  catalog, tags for eggs and nodes, and a console that works on phones.


  This app bundles everything Pterodactyl needs: the Panel, MariaDB, Redis and the Wings daemon. On first
  start it creates your admin account, a node called "Umbrel" connected to the bundled Wings, and port
  allocations 26565-26600, so you can create a server right away. It can be installed next to the stable
  Pterodactyl app.


  Ports used on your Umbrel:

  - 8755: Panel web interface

  - 8756: Wings API and console websocket

  - 2023: SFTP

  - 26565-26600: game server allocations (add more in the node's Allocation settings)


  ⚠️ Game servers run as containers on your Umbrel's Docker. Watch out for port conflicts with other apps.
  The node uses the address umbrel.local. If you open the panel by IP or through Tailscale, change the node's
  FQDN in the node settings so the server console can connect.


  ⚠️ Stop or delete your game servers in the panel before uninstalling this app.
releaseNotes: |-
  Pterodactyl Panel v2.0.0-beta.2 with Wings v1.13.5.

  Wings v1.13.5:
  ## What's Changed
  * `wings configure` now takes the node's mounts from the Panel by @SkyMulley in https://github.com/pterodactyl/wings/pull/351

  Re-running `wings configure` replaces `allowed_mounts` in `config.yml` with the mounts attached to the node in the Panel. Mounts you added to `config.yml` by hand are removed unless they are also attached to the node. The data directory (`system.data`) is not changed.

  **Full Changelog**: https://github.com/pterodactyl/wings/compare/v1.13.4...v1.13.5

  https://github.com/pterodactyl/wings/releases/tag/v1.13.5
